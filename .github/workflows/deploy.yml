name: Deploy showcase

on:
  schedule:
    - cron: '0 21 * * *' # 每天 05:00（UTC+8）重新抓一次 GitHub 数据
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch repos
        # GITHUB_TOKEN 查 viewer 会得到 github-actions[bot]（只看得见本仓库），
        # 所以只有在配了带 public read 的 SHOWCASE_TOKEN 时才重新抓取；
        # 否则用仓库里已有的 data/repos.json 快照构建，站点不会挂。
        if: ${{ secrets.SHOWCASE_TOKEN != '' }}
        run: node scripts/fetch-repos.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.SHOWCASE_TOKEN }}

      - name: Use committed snapshot
        if: ${{ secrets.SHOWCASE_TOKEN == '' }}
        run: |
          echo "未配置 SHOWCASE_TOKEN，使用仓库内的 data/repos.json 快照"
          node -e "const d=require('./data/repos.json');console.log('快照：'+d.repos.length+' 个公开仓库，抓取于 '+d.generatedAt)"

      - name: Build site + profile README
        run: |
          node scripts/build.mjs
          node scripts/build-readme.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
