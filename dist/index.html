<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代码之力 · ShiningRay</title>
<meta name="description" content="ShiningRay（代码之力）的 GitHub 作品集：主力是 Ruby / Rails 与 TypeScript / JavaScript，另有 Crystal、Zig 等实验。">
<meta property="og:type" content="website">
<meta property="og:title" content="代码之力 · ShiningRay">
<meta property="og:description" content="ShiningRay（代码之力）的 GitHub 作品集：主力是 Ruby / Rails 与 TypeScript / JavaScript，另有 Crystal、Zig 等实验。">
<meta name="color-scheme" content="dark light">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" fill="%230b0913"/><path fill="%23ff5fa2" d="M7 1h2v5h5v2h-5v5H7V8H2V6h5z"/></svg>'>
<style>
/* ============ tokens ============ */
:root{
  --bg:#0b0913; --bg2:#120e1f; --panel:#171225; --panel2:#1e1730;
  --ink:#f4efff; --muted:#c7bbe0; --dim:#a296c0;
  --pink:#ff5fa2; --cyan:#5ce1e6; --violet:#a78bfa; --lime:#b8f26b; --yellow:#ffd166;
  --line:#332a4c; --line2:#4a3c70; --shadow:#06040b;
  --sans:system-ui,-apple-system,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;
  --px:4px;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#fff7fb; --bg2:#fdeef7; --panel:#ffffff; --panel2:#fdf3f9;
    --ink:#1c1428; --muted:#4b3f66; --dim:#6b5f87;
    --pink:#d92c76; --cyan:#0c8a92; --violet:#6d4bd8; --lime:#4d8c1a; --yellow:#a8730a;
    --line:#e7d8ef; --line2:#cbb6da; --shadow:#e3cfe0;
  }
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth; scroll-padding-top:84px}
::selection{background:var(--pink); color:#1a0a12}
body{
  margin:0; color:var(--ink); background-color:var(--bg); font-family:var(--sans);
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(900px 520px at 8% -8%, color-mix(in srgb, var(--pink) 18%, transparent), transparent 62%),
    radial-gradient(820px 460px at 96% 2%, color-mix(in srgb, var(--cyan) 14%, transparent), transparent 64%),
    radial-gradient(700px 500px at 50% 110%, color-mix(in srgb, var(--violet) 12%, transparent), transparent 66%);
}
body::after{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
  background-image:
    linear-gradient(color-mix(in srgb, var(--ink) 5%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--ink) 5%, transparent) 1px, transparent 1px);
  background-size:24px 24px;
  -webkit-mask-image:radial-gradient(120% 90% at 50% 0%, #000 20%, transparent 82%);
  mask-image:radial-gradient(120% 90% at 50% 0%, #000 20%, transparent 82%);
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--pink); outline-offset:3px}
.skip{position:absolute;left:-9999px}
.skip:focus{left:16px;top:12px;z-index:99;background:var(--panel);border:2px solid var(--pink);padding:8px 14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ chrome ============ */
.top{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between;
  gap:16px; padding:14px clamp(16px,4vw,44px);
  background:color-mix(in srgb, var(--bg) 84%, transparent);
  backdrop-filter:blur(12px); border-bottom:2px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{color:var(--pink);flex:none}
.brand-cn{font-weight:800;letter-spacing:-.01em}
.brand-en{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.top-links{display:flex;align-items:center;gap:10px}
.btn{
  display:inline-flex;align-items:center;gap:8px; padding:9px 15px;
  border:2px solid var(--line2); background:var(--panel); color:var(--ink);
  font:600 12.5px/1 var(--mono); letter-spacing:.06em; text-transform:uppercase;
  box-shadow:3px 3px 0 var(--shadow); cursor:pointer;
  transition:transform .12s steps(2,end), box-shadow .12s steps(2,end), border-color .12s, background .12s;
}
.btn:hover{transform:translate(-1px,-1px); box-shadow:5px 5px 0 var(--shadow); border-color:var(--pink)}
.btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--shadow)}
.btn-primary{background:var(--pink); color:#1a0a12; border-color:#1a0a12; box-shadow:4px 4px 0 var(--cyan)}
.btn-primary:hover{border-color:#1a0a12; box-shadow:6px 6px 0 var(--cyan)}
@media (prefers-color-scheme:light){ .btn-primary{color:#fff} }
.lang{display:flex; border:2px solid var(--line2); background:var(--panel); box-shadow:3px 3px 0 var(--shadow)}
.lang button{
  display:block; padding:8px 11px; border:0; background:none; color:var(--dim); cursor:pointer;
  font:600 12px/1 var(--mono); letter-spacing:.08em;
}
.lang button[aria-pressed="true"]{background:var(--pink); color:#1a0a12}
@media (prefers-color-scheme:light){ .lang button[aria-pressed="true"]{color:#fff} }

/* ============ layout ============ */
main{position:relative; z-index:1; max-width:1240px; margin:0 auto; padding:clamp(28px,5vw,64px) clamp(16px,4vw,44px) 0}
.hero{display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr); gap:clamp(24px,4vw,56px); align-items:start}
.hero-left{min-width:0}
.avatar-row{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.avatar-frame{position:relative;flex:none;width:86px;height:86px;border:2px solid var(--line2);box-shadow:4px 4px 0 var(--shadow);background:var(--panel)}
.avatar-frame img{display:block;width:100%;height:100%;object-fit:cover;filter:saturate(1.05) contrast(1.03)}
.avatar-frame::after{content:"";position:absolute;right:-6px;bottom:-6px;width:16px;height:16px;background:var(--cyan);border:2px solid var(--shadow)}
.spark{position:absolute;width:5px;height:5px;background:var(--yellow);animation:twinkle 2.6s steps(2,end) infinite}
.spark.s1{left:-10px;top:-8px}
.spark.s2{right:-14px;top:18px;background:var(--pink);animation-delay:.5s}
.spark.s3{left:6px;bottom:-12px;background:var(--violet);animation-delay:1.1s}
@keyframes twinkle{0%,60%{opacity:1;transform:scale(1)}61%,100%{opacity:.25;transform:scale(.7)}}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;
  font:600 11px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);
}
.eyebrow::before{content:"";width:8px;height:8px;background:var(--cyan)}
h1{margin:0;font-size:clamp(34px,5.4vw,58px);line-height:1.02;font-weight:900;letter-spacing:-.03em}
.h1-en{display:block;margin-top:12px;font:600 11px/1 var(--mono);letter-spacing:.34em;text-transform:uppercase;color:var(--dim)}
.lede{margin:20px 0 0;max-width:46ch;color:var(--muted);font-size:15.5px;line-height:1.75}
.bubble{
  position:relative;margin:26px 0 0;padding:14px 16px 14px 54px;max-width:44ch;
  border:2px solid var(--line2);background:var(--panel);box-shadow:4px 4px 0 var(--shadow);
}
.bubble svg{position:absolute;left:14px;top:14px;shape-rendering:crispEdges}
.bubble-line{margin:0;font-weight:700;font-size:14.5px}
.bubble-tag{margin:4px 0 0;color:var(--dim);font-size:13px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.kana{
  position:fixed; right:8px; top:50%; transform:translateY(-50%); z-index:2; pointer-events:none;
  writing-mode:vertical-rl; font:700 11px/1.9 var(--mono); letter-spacing:.5em;
  color:color-mix(in srgb, var(--violet) 40%, transparent); user-select:none;
}

/* ============ status panel ============ */
.status{position:relative;border:2px solid var(--line2);background:var(--panel);box-shadow:6px 6px 0 var(--shadow);padding:18px}
.status-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.status-head h2{margin:0;font:600 11px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.status-badge{font:600 10.5px/1 var(--mono);letter-spacing:.1em;color:var(--dim);border:1px solid var(--line2);padding:5px 7px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0;padding:0;list-style:none}
.tile{border:2px solid var(--line);border-top-width:4px;padding:10px 12px 12px;background:var(--panel2)}
.tile:nth-child(1){border-top-color:var(--pink)}
.tile:nth-child(2){border-top-color:var(--cyan)}
.tile:nth-child(3){border-top-color:var(--violet)}
.tile:nth-child(4){border-top-color:var(--yellow)}
.tile b{display:block;font:800 26px/1 var(--mono);letter-spacing:-.02em}
.tile span{display:block;margin-top:6px;font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.langmix{margin-top:18px;padding-top:16px;border-top:2px dashed var(--line)}
.langmix h3{margin:0 0 10px;font:600 11px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.langbar{display:flex;gap:3px;height:12px}
.langbar i{display:block;min-width:3px;background:var(--c,var(--violet))}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:12px 0 0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);min-width:0}
.legend i{width:8px;height:8px;flex:none;background:var(--c)}
.legend .lg-n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
.legend .lg-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============ sections ============ */
section{margin-top:clamp(46px,7vw,84px)}
.sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:20px}
.sec-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.sec-head h2::before{content:"✦";color:var(--pink);margin-right:9px;font-size:14px;vertical-align:2px}
.sec-count{font:600 11px/1 var(--mono);letter-spacing:.12em;color:var(--dim);border:1px solid var(--line2);padding:4px 7px}
.sec-line{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px)}

/* ============ now playing ============ */
.playing{margin-top:clamp(34px,4.5vw,52px)}
.play-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.play-head h2{display:flex;align-items:center;gap:9px;margin:0;font:600 11px/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.play-head h2::before{content:"";width:8px;height:8px;background:var(--lime)}
.play-note{margin:0;color:var(--dim);font-size:13px}
.gcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0;padding:0;list-style:none}
.gcard{
  position:relative;display:flex;align-items:center;gap:13px;padding:13px 15px;
  border:2px solid var(--line);border-left:4px solid var(--c);background:var(--panel);
  box-shadow:3px 3px 0 var(--shadow);
  transition:transform .12s steps(2,end), border-color .12s, box-shadow .12s;
}
.gcard:hover{transform:translate(-2px,-2px);border-color:var(--c);box-shadow:5px 5px 0 var(--shadow)}
.gicon{flex:none;width:32px;height:32px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb, var(--c) 12%, transparent);border:1px solid color-mix(in srgb, var(--c) 34%, transparent)}
.gcard b{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.gcard i{display:block;margin-top:3px;font:500 10.5px/1.3 var(--mono);letter-spacing:.06em;color:var(--dim);font-style:normal;text-transform:uppercase}
.gtag{position:absolute;right:0;top:0;padding:3px 6px;background:var(--c);color:#140c1c;font:700 9.5px/1 var(--mono);letter-spacing:.1em}
@media (prefers-color-scheme:light){ .gtag{color:#fff} }
@media (max-width:900px){ .gcards{grid-template-columns:1fr} }

/* ============ stack / 主力技术 ============ */
.stack{margin-top:clamp(30px,4vw,46px)}
.stack .play-head h2::before{background:var(--pink)}
.stacks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0;padding:0;list-style:none}
.sitem{
  position:relative;padding:14px 16px 13px;border:2px solid var(--line);border-left:4px solid var(--c);
  background:var(--panel);box-shadow:3px 3px 0 var(--shadow);
  transition:transform .12s steps(2,end), border-color .12s, box-shadow .12s;
}
.sitem:hover{transform:translate(-2px,-2px);border-color:var(--c);box-shadow:5px 5px 0 var(--shadow)}
.sitem b{display:block;padding-right:62px;font:700 16px/1.25 var(--mono);letter-spacing:-.01em;color:var(--ink);overflow-wrap:anywhere}
.sitem i{display:block;margin-top:5px;font:500 12.5px/1.55 var(--sans);color:var(--dim);font-style:normal}
.srole{position:absolute;right:0;top:0;padding:3px 6px;background:var(--c);color:#140c1c;font:700 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
@media (prefers-color-scheme:light){ .srole{color:#fff} }
@media (max-width:900px){ .stacks{grid-template-columns:1fr} }

/* ============ writing / 写过译过 ============ */
.writing{margin-top:clamp(46px,7vw,84px)}
.writing .sec-head h2::before{content:"✎";color:var(--pink);font-size:15px}
.wcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.wcard{
  position:relative;display:flex;border:2px solid var(--line2);background:var(--panel);
  box-shadow:4px 4px 0 var(--shadow);
  transition:transform .12s steps(2,end), box-shadow .12s steps(2,end);
}
.wcard:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--shadow)}
.wspine{flex:none;display:flex;flex-direction:column;width:12px;background:var(--c);box-shadow:inset -4px 0 0 color-mix(in srgb, var(--shadow) 40%, transparent)}
.wspine i{flex:1;background:var(--c);border-bottom:2px solid var(--shadow)}
.wspine i:nth-child(even){filter:brightness(1.22) saturate(1.1)}
.wspine i:last-child{border-bottom:0}
.wbody{flex:1;min-width:0;padding:16px 18px 15px}
.wcard h3{margin:0;padding-right:56px;font-size:16.5px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.wcard h3 a:hover{color:var(--pink)}
.wcard h3 .wen{display:block;margin-top:5px;font:600 10px/1.45 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.wcard p{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.7}
.wrole{position:absolute;right:0;top:0;padding:3px 6px;background:var(--c);color:#140c1c;font:700 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
@media (prefers-color-scheme:light){ .wrole{color:#fff} }
.wmeta{margin-top:11px;font:500 10.5px/1.6 var(--mono);letter-spacing:.04em;color:var(--dim)}
.wmeta b{font-weight:700;color:var(--muted)}

/* 技术图标（手绘 16×16 像素） */
.sicogroup{display:inline-flex;align-items:flex-end;gap:5px;margin-right:9px;vertical-align:-4px}
.sicon{width:22px;height:22px;flex:none;filter:drop-shadow(2px 2px 0 var(--shadow))}
.sicon--sm{width:18px;height:18px}

/* 封面 */
.wcovers{flex:none;display:flex;align-items:flex-end;gap:8px;padding:14px 0 14px 14px}
.wcovers a{display:block;line-height:0;box-shadow:3px 3px 0 var(--shadow);border:2px solid var(--line);transition:transform .14s steps(2,end),border-color .14s steps(2,end),box-shadow .14s steps(2,end)}
.wcovers a:last-child{border-color:var(--c)}
.wcovers a:hover{transform:translate(-2px,-3px);border-color:var(--c);box-shadow:5px 6px 0 var(--shadow)}
.wcovers img{display:block;width:86px;height:auto;image-rendering:auto}
.wcovers a:last-child img{width:96px}
.wlinks{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.wlink{padding:4px 8px;border:2px solid var(--line);font:600 10.5px/1 var(--mono);letter-spacing:.06em;color:var(--muted);text-decoration:none;transition:all .12s steps(2,end)}
.wlink:hover{border-color:var(--c);color:var(--ink);transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--shadow)}
.wlink b{color:var(--c)}
@media(max-width:640px){.wcard{flex-direction:column}.wcovers{padding:14px 14px 0;order:-1;flex-wrap:nowrap;gap:7px}.wcovers img{width:78px}.wcovers a:last-child img{width:86px}.wbody{padding:14px 15px 15px}.wcard h3{padding-right:0}.wrole{position:static;display:inline-block;margin-bottom:9px}}

/* 来历 */
.origin{margin-top:34px}
.ocard{position:relative;padding:19px 20px 18px;background:var(--panel);border:2px solid var(--line);box-shadow:4px 4px 0 var(--shadow)}
.ologos{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;padding-right:112px}
.ologo{display:grid;place-items:center;padding:6px;background:var(--panel2);border:2px solid var(--line);box-shadow:2px 2px 0 var(--shadow);line-height:0}
.ologo img{display:block;width:auto;height:26px}
.ologo--emblem img{width:46px;height:46px}
.ologo--wide img{height:24px;max-width:100%;object-fit:contain}
@media(prefers-color-scheme:light){.ologo img{filter:invert(1)}}
.obody{min-width:0;padding-right:104px}
.ocard h3{display:flex;flex-wrap:wrap;align-items:baseline;gap:9px;margin:0;font:700 19px/1.35 var(--sans);letter-spacing:-.01em}
.oen{font:500 11px/1.4 var(--mono);letter-spacing:.05em;color:var(--muted);text-transform:none}
.oline{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-top:10px;font:500 12px/1.5 var(--mono);letter-spacing:.04em;color:var(--muted)}
.oyears{font-weight:700;color:var(--ink)}
.onote{margin-top:12px;padding-left:11px;border-left:3px solid var(--c);font-size:13.5px;line-height:1.7;color:var(--dim)}
.omerged{margin-top:9px;font:500 11.5px/1.65 var(--mono);letter-spacing:.03em;color:var(--dim)}
.obadge{position:absolute;right:0;top:0;padding:6px 10px;background:var(--c);color:#12101c;font:700 10px/1 var(--mono);letter-spacing:.14em}
@media(max-width:640px){.ocard{padding:16px 15px 15px}.obody{padding-right:0}.obadge{position:static;display:inline-block;margin-bottom:10px;order:2}.ologos{padding-right:0}.ologo--wide img{max-width:100%;height:auto}}

/* ============ featured ============ */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.fcard{
  position:relative;display:flex;flex-direction:column;padding:20px 20px 18px;
  border:2px solid var(--line2);border-left-width:6px;border-left-color:var(--pink);
  background:linear-gradient(180deg,var(--panel),var(--panel2));box-shadow:5px 5px 0 var(--shadow);
  transition:transform .12s steps(2,end), box-shadow .12s steps(2,end), border-left-color .12s;
}
.fcard:nth-child(2){border-left-color:var(--cyan)}
.fcard:nth-child(3){border-left-color:var(--violet)}
.fcard:nth-child(4){border-left-color:var(--yellow)}
.fcard:nth-child(5){border-left-color:var(--lime)}
.fcard:nth-child(6){border-left-color:var(--pink)}
.fcard:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--shadow)}
.fnum{font:600 10.5px/1 var(--mono);letter-spacing:.16em;color:var(--dim)}
.fcard h3{margin:10px 0 8px;font-size:18px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.fcard h3 a:hover{color:var(--pink)}
.fcard p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.65;flex:1}
.fmeta{display:flex;align-items:center;gap:8px;margin-top:14px;font:600 11px/1 var(--mono);letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.farrow{position:absolute;right:16px;top:16px;font:700 15px/1 var(--mono);color:var(--line2);transition:color .12s,transform .12s}
.fcard:hover .farrow{color:var(--pink);transform:translate(2px,-2px)}

/* ============ legacy / 曾经 ============ */
.legacy{margin-top:clamp(46px,7vw,84px)}
.legacy .sec-head h2::before{content:"▚";color:var(--pink)}
.lnote{margin:-6px 0 20px;color:var(--dim);font-size:13px;max-width:62ch}
.lcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.lcard{
  position:relative;display:flex;flex-direction:column;
  border:2px solid var(--line2);background:var(--panel);box-shadow:4px 4px 0 var(--shadow);
  transition:transform .12s steps(2,end), box-shadow .12s steps(2,end);

  function pickLang() {

    const nav = (navigator.language || 'zh').toLowerCase();
    return nav.startsWith('zh') ? 'zh' : AVAILABLE.includes('en') ? 'en' : D.lang || 'zh';
  }

            </div>
          </div>
          <a class="llink" href="${esc(arch)}" target="_blank" rel="noopener">
            <span>${esc(T('seeArchive'))}<span class="lsrc"> · ${esc(T('archiveSrc'))}</span></span>
            <span class="lar" aria-hidden="true">↗</span>
          </a>
        </article>`;
      })
      .join('');
  }

  /* ---------- 统计 ---------- */
  function paintStats() {
    const st = D.stats;
    const cells = [
      [st.repos, T('statProjects')],
      [D.collections.length, T('statSeries')],
      [st.languages, T('statLanguages')],
      [st.stars, T('statStars')],
    ];
    $('#tiles').innerHTML = cells
      .map(([v, label]) => `<li class="tile"><b data-n="${v}">0</b><span>${esc(label)}</span></li>`)
      .join('');
    if (D.firstYear) $('#statusSince').textContent = lang === 'zh' ? `自 ${D.firstYear} 起` : `since ${D.firstYear}`;

    const total = D.languages.reduce((s, l) => s + l.count, 0) || 1;
    $('#langbar').innerHTML = D.languages
      .map((l) => `<i style="--c:${esc(l.color)};flex:${l.count}"></i>`)
      .join('');
    $('#legend').innerHTML = D.languages
      .map(
        (l) => `<li title="${esc(l.name)}: ${l.count}">
          <i style="--c:${esc(l.color)}"></i><span class="lg-name">${esc(l.name)}</span>
          <span class="lg-n">${Math.round((l.count / total) * 100)}%</span></li>`,
      )
      .join('');

    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    document.querySelectorAll('[data-n]').forEach((el) => {
      const target = Number(el.dataset.n) || 0;
      if (reduce || target > 9999) { el.textContent = num(target); return; }
      let cur = 0;
      const step = Math.max(1, Math.ceil(target / 18));
      const tick = () => {
        cur = Math.min(target, cur + step);
        el.textContent = num(cur);
        if (cur < target) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
  }

  /* ---------- 筛选控件 ---------- */
  function paintControls() {
    const total = D.languages.reduce((s, l) => s + l.count, 0) || 1;
    $('#langSel').innerHTML =
      `<option value="all">${esc(T('allLanguages'))}</option>` +
      D.languages
        .map((l) => `<option value="${esc(l.name)}">${esc(l.name)} · ${l.count}</option>`)
        .join('');
    $('#langSel').value = langFilter;

    $('#sortSel').innerHTML = [
      ['recent', T('sortRecent')],
      ['stars', T('sortStars')],
      ['name', T('sortName')],
    ]
      .map(([v, label]) => `<option value="${v}">${esc(label)}</option>`)
      .join('');
    $('#sortSel').value = sortBy;

    const chips = [{ id: 'all', name: T('all'), count: D.repos.length }].concat(
      D.collections.map((c) => ({ id: c.id, name: L(c, 'name'), count: c.count })),
    );
    $('#chips').innerHTML = chips
      .map(
        (c) =>
          `<button class="chip" type="button" data-coll="${esc(c.id)}" aria-pressed="${coll === c.id}">${esc(c.name)}<b>${c.count}</b></button>`,
      )
      .join('');
  }

  /* ---------- 精选 ---------- */
  function paintFeatured(show) {
    $('#featured').hidden = !show;
    if (!show) return;
    const items = D.featured.map((n) => D.repos.find((r) => r.name === n)).filter(Boolean);
    $('#featCount').textContent = String(items.length).padStart(2, '0');
    $('#fgrid').innerHTML = items
      .map((r, i) => {
        const d = L(r, 'description') || L(r, 'readme') || '';
        return `<article class="fcard">
          <span class="fnum">${String(i + 1).padStart(2, '0')} / ${esc(T('featured').toUpperCase())}</span>
          <span class="farrow" aria-hidden="true">↗</span>
          <h3><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a></h3>
          <p>${esc(d)}</p>
          <div class="fmeta"><span class="langdot" style="--c:${esc(r.color)}"></span>${esc(r.language || '—')}
            <span class="sep">·</span> ★ ${num(r.stars)}</div>
        </article>`;
      })
      .join('');
  }

  /* ---------- 列表 ---------- */
  function matches(r) {
    if (coll !== 'all' && !(r.collections || []).includes(coll)) return false;
    if (langFilter !== 'all' && r.language !== langFilter) return false;
    if (!q) return true;
    const hay = [r.name, r.description, r.descriptionEn, (r.topics || []).join(' ')].join(' ').toLowerCase();
    return hay.includes(q);
  }

  function sortList(list) {
    const byName = (a, b) => a.name.localeCompare(b.name, 'en');
    if (sortBy === 'name') return [...list].sort(byName);
    if (sortBy === 'stars') return [...list].sort((a, b) => b.stars - a.stars || byName(a, b));
    return [...list].sort((a, b) => (a.pushedAt < b.pushedAt ? 1 : a.pushedAt > b.pushedAt ? -1 : 0));
  }

  function paintList() {
    const list = sortList(D.repos.filter(matches));
    $('#projCount').textContent = T('count') ? `${list.length} ${T('count')}` : String(list.length);
    $('#empty').hidden = list.length > 0;
    $('#grid').innerHTML = list
      .map((r) => {
        const d = L(r, 'description') || L(r, 'readme') || '';
        const topics = (r.topics || [])
          .slice(0, 3)
          .map((t) => `<span>${esc(t)}</span>`)
          .join('');
        return `<article class="card" style="--c:${esc(r.color)}">
          <div class="card-top">
            <h3><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a></h3>
            ${r.stars ? `<span class="stars">★ ${num(r.stars)}</span>` : ''}
          </div>
          <p class="desc${d ? '' : ' no-desc'}">${d ? esc(d) : '—'}</p>
          <div class="meta">
            <span class="langdot" style="--c:${esc(r.color)}"></span>
            <span>${esc(r.language || 'n/a')}</span>
            <span class="sep">·</span><span>${month(r.pushedAt)}</span>
            ${r.archived ? `<span class="tag-arch">${esc(T('archived'))}</span>` : ''}
          </div>
          ${topics ? `<div class="topics">${topics}</div>` : ''}
        </article>`;
      })
      .join('');
  }

  function refresh() {
    const filtering = !!q || coll !== 'all' || langFilter !== 'all';
    paintFeatured(!filtering);
    const c = D.collections.find((x) => x.id === coll);
    $('#seriesBlurb').textContent = c ? L(c, 'blurb') : '';
    paintList();
  }

  /* ---------- 事件 ---------- */
  function setLang(next) {
    if (!AVAILABLE.includes(next)) return;
    lang = next;
    store.set(next);
    paintText();
    paintStack();
    paintGames();
    paintWritings();
    paintOrigin();
    paintLegacy();
    paintStats();
    paintControls();
    refresh();
  }

  function bind() {
    document.querySelectorAll('.lang button').forEach((b) =>
      b.addEventListener('click', () => setLang(b.dataset.lang)),
    );

    const search = $('#search');
    let timer;
    search.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        q = search.value.trim().toLowerCase();
        refresh();
      }, 110);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== search) {
        e.preventDefault();
        search.focus();
      }
      if (e.key === 'Escape' && document.activeElement === search) {
        search.value = '';
        q = '';
        refresh();
      }
    });

    $('#langSel').addEventListener('change', (e) => {
      langFilter = e.target.value;
      refresh();
    });
    $('#sortSel').addEventListener('change', (e) => {
      sortBy = e.target.value;
      refresh();
    });
    $('#chips').addEventListener('click', (e) => {
      const b = e.target.closest('[data-coll]');
      if (!b) return;
      coll = b.dataset.coll;
      paintControls();
      refresh();
    });
    $('#clearBtn').addEventListener('click', () => {
      q = '';
      coll = 'all';
      langFilter = 'all';
      $('#search').value = '';
      paintControls();
      refresh();
    });
  }

  /* ---------- 启动 ---------- */
  const av = $('#avatar');
  if (D.owner.avatar) av.src = D.owner.avatar;
  av.alt = D.owner.name || D.owner.login || '';
  av.addEventListener('error', () => { av.style.visibility = 'hidden'; });

  paintText();
  paintStack();
  paintGames();
  paintWritings();
  paintOrigin();
  paintLegacy();
  paintStats();
  paintControls();
  refresh();
  bind();
})();
</script>
</body>
</html>
